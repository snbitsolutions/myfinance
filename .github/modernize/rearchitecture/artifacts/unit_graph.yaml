units:
  - name: app-startup
    trigger: page
    trigger_detail: "Application launch at lib/main.dart"
    source_anchors:
      - path: lib/main.dart
        line: 15
      - path: lib/screens/splash/splash_screen.dart
        line: 1
    exported_signature:
      - method: "void main()"
        source_loc: "lib/main.dart:15"
        stability: must_preserve
    dynamic_entrypoints: []
    depends_on:
      - unit: authentication
        via: "AppRouter redirect/session check"
    shared_refs:
      - module: app-router
        used_fields: [router, redirectLoading]
      - module: auth-session-storage
        used_fields: [readAuthToken, hasSessionBoundToFingerprint]

  - name: onboarding
    trigger: page
    trigger_detail: "Route /onboarding"
    source_anchors:
      - path: lib/screens/onboarding/onboarding_screen.dart
        line: 1
    exported_signature: []
    dynamic_entrypoints: []
    depends_on:
      - unit: authentication
        via: "context.go('/login')"
    shared_refs:
      - module: app-router
        used_fields: [router]

  - name: authentication
    trigger: page
    trigger_detail: "Routes /login, /signup, /existing-member-enrollment, /otp, /set-pin"
    source_anchors:
      - path: lib/screens/auth/login_screen.dart
        line: 15
      - path: lib/screens/auth/otp_screen.dart
        line: 12
      - path: lib/screens/auth/signup_screen.dart
        line: 1
      - path: lib/screens/auth/existing_member_enrollment_screen.dart
        line: 45
      - path: lib/screens/auth/set_pin_screen.dart
        line: 1
    exported_signature:
      - method: "Future<void> AuthNotifier.sendLoginOtp({required String phoneNumber, required String accountNumber})"
        source_loc: "lib/core/providers/app_providers.dart:519"
        stability: must_preserve
      - method: "Future<void> AuthNotifier.loginWithOtp({required String phoneNumber, required String accountNumber, required String otp})"
        source_loc: "lib/core/providers/app_providers.dart:699"
        stability: must_preserve
    dynamic_entrypoints: []
    depends_on:
      - unit: app-startup
        via: "router redirect and secure session restoration"
      - unit: profile
        via: "authProvider state"
    shared_refs:
      - module: auth-provider
        used_fields: [authProvider, authServiceProvider, sendLoginOtp, loginWithOtp]
      - module: auth-session-storage
        used_fields: [storeSession, readAuthToken, storePin, hasSessionBoundToFingerprint]
      - module: app-router
        used_fields: [router]

  - name: dashboard
    trigger: route
    trigger_detail: "Route /home"
    source_anchors:
      - path: lib/screens/dashboard/dashboard_screen.dart
        line: 1
      - path: lib/core/layout/main_shell.dart
        line: 1
    exported_signature: []
    dynamic_entrypoints: []
    depends_on:
      - unit: authentication
        via: "authProvider and guarded shell access"
      - unit: loans
        via: "loan actions"
      - unit: savings
        via: "savings actions"
      - unit: payments
        via: "payment actions"
    shared_refs:
      - module: auth-provider
        used_fields: [authProvider, userProfileProvider, loansProvider, savingsProvider, transactionsProvider]
      - module: app-router
        used_fields: [router]
      - module: shared-ui
        used_fields: [AppScaffold, AppCard]

  - name: loans
    trigger: route
    trigger_detail: "Routes /loans, /apply-loan, /loan-status, /loan-detail, /repayment"
    source_anchors:
